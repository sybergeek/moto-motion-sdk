[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moto-motion"
version = "0.1.0"
description = "Reusable 2D motorsport motion graphics SDK for Formula 1 and MotoGP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "manim>=0.18",
  "numpy>=1.26",
  "scipy>=1.11",
  "drawsvg>=2.3",
  "svgpathtools>=1.6",
  "moviepy>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
tts = ["kokoro>=0.9.4", "soundfile>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
